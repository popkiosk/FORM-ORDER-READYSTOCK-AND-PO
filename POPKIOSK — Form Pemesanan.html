<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POPKIOSK — Form Pemesanan</title>
<style>
  :root{
    --pink: #ff3d8a;
    --pink-deep: #d6006b;
    --pink-pale: #ffe1ee;
    --ink: #17141b;
    --ink-soft: #4a4552;
    --paper: #fff8fb;
    --line: #f0c2dc;
    --yellow: #f5e600;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin:0;
    min-height:100%;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #ffd7ea 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, #ffc6e2 0%, transparent 50%),
      var(--paper);
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 32px 16px 56px;
  }
  .sheet{
    width:100%;
    max-width:560px;
  }
  .brandbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
  }
  .paw{
    width:46px; height:46px; flex:none;
    border-radius: 14px;
    background: linear-gradient(145deg, var(--pink), var(--pink-deep));
    position:relative;
    box-shadow: 0 6px 14px rgba(214,0,107,.28);
  }
  .paw::before, .paw::after{
    content:"";
    position:absolute;
    background: var(--ink);
    border-radius: 50%;
  }
  .paw::before{ width:8px; height:8px; top:9px; left:9px; box-shadow: 20px 0 0 var(--ink); opacity:.85; }
  .paw::after{ width:16px; height:13px; bottom:8px; left:15px; border-radius: 50% 50% 45% 45%; opacity:.85; }
  .brand-text .kicker{
    font-size:11px;
    letter-spacing:.14em;
    color: var(--pink-deep);
    font-weight:700;
    margin:0 0 2px;
  }
  .brand-text h1{
    margin:0;
    font-size: 26px;
    line-height:1;
    color: var(--ink);
    font-weight:900;
    font-style:italic;
    letter-spacing:.5px;
  }
  .brand-text h1 span{ color: var(--pink-deep); }

  .card{
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 22px;
    padding: 26px 22px 22px;
    box-shadow: 8px 8px 0 var(--pink);
    position:relative;
    overflow:hidden;
  }
  .card::after{
    content:"♪";
    position:absolute;
    top:-6px; right:14px;
    font-size:54px;
    color: var(--pink-pale);
    transform: rotate(12deg);
    pointer-events:none;
  }
  .lede{
    margin: 0 0 20px;
    font-size:14px;
    color: var(--ink-soft);
    line-height:1.5;
  }
  .lede b{ color: var(--ink); }

  form{ display:flex; flex-direction:column; gap:16px; position:relative; }

  label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color: var(--pink-deep);
    margin-bottom:6px;
    letter-spacing:.01em;
  }
  input[type="text"], input[type="tel"], textarea{
    width:100%;
    border: 2px solid var(--line);
    background: var(--pink-pale);
    border-radius: 12px;
    padding: 11px 13px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    transition: border-color .15s ease, background .15s ease;
  }
  textarea{ resize: vertical; min-height: 64px; }
  input::placeholder, textarea::placeholder{ color: #c98fae; }
  input:focus, textarea:focus{
    outline: none;
    border-color: var(--pink);
    background: #fff;
  }

  .field-row{ display:flex; gap:12px; }
  .field-row > div{ flex:1; min-width:0; }

  .choice-group{
    display:flex;
    gap:10px;
  }
  .choice{
    flex:1;
    position:relative;
  }
  .choice input{
    position:absolute;
    opacity:0;
    width:100%; height:100%;
    margin:0;
    cursor:pointer;
  }
  .choice span{
    display:block;
    text-align:center;
    border: 2px solid var(--line);
    background: var(--pink-pale);
    border-radius: 12px;
    padding: 12px 8px;
    font-size: 13.5px;
    font-weight:700;
    color: var(--ink-soft);
    transition: all .15s ease;
  }
  .choice input:checked + span{
    border-color: var(--pink);
    background: var(--pink);
    color:#fff;
    box-shadow: 0 3px 0 var(--pink-deep);
  }
  .choice input:focus-visible + span{
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .hint{
    font-size:11.5px;
    color:#a15b7d;
    margin-top:4px;
  }

  button.submit{
    margin-top:6px;
    border:2px solid var(--ink);
    background: var(--yellow);
    color: var(--ink);
    font-weight:900;
    font-style:italic;
    font-size:16px;
    padding: 15px 18px;
    border-radius: 14px;
    cursor:pointer;
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform .1s ease, box-shadow .1s ease;
    letter-spacing:.02em;
  }
  button.submit:hover{ transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--ink); }
  button.submit:active{ transform: translate(1px,1px); box-shadow: 3px 3px 0 var(--ink); }
  button.submit:disabled{
    opacity:.55;
    cursor:not-allowed;
    box-shadow: 5px 5px 0 var(--ink);
    transform:none;
  }

  .err{
    font-size:12px;
    color:#c0006a;
    min-height:0;
    display:none;
  }
  .err.show{ display:block; }

  .foot{
    text-align:center;
    margin-top:18px;
    font-size:12px;
    color: var(--ink-soft);
  }
  .foot b{ color: var(--pink-deep); }

  @media (prefers-color-scheme: dark){
    body{
      background:
        radial-gradient(circle at 12% 8%, #3a0f27 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, #34101f 0%, transparent 50%),
        #1c1620;
      color:#f6ecf2;
    }
    .card{ background:#241b28; border-color:#f6ecf2; }
    .card::after{ color:#3a2233; }
    .lede{ color:#cbb9c6; }
    .lede b{ color:#f6ecf2; }
    input[type="text"], input[type="tel"], textarea{
      background:#2f2333; border-color:#4a3348; color:#f6ecf2;
    }
    input:focus, textarea:focus{ background:#382a3c; }
    .choice span{ background:#2f2333; border-color:#4a3348; color:#cbb9c6; }
    button.submit{ box-shadow: 5px 5px 0 #f6ecf2; border-color:#f6ecf2; color:#1c1620; }
    button.submit:hover{ box-shadow: 7px 7px 0 #f6ecf2; }
    button.submit:active{ box-shadow: 3px 3px 0 #f6ecf2; }
    .foot{ color:#cbb9c6; }
  }

  @media (max-width: 400px){
    .field-row{ flex-direction:column; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="brandbar">
    <div class="paw" aria-hidden="true"></div>
    <div class="brand-text">
      <p class="kicker">ALL 'BOUT UR BIAS</p>
      <h1>POP<span>KIOSK</span></h1>
    </div>
  </div>

  <div class="card">
    <p class="lede">Isi detail pesananmu di bawah ini. Setelah ditekan, pesanan akan langsung tersusun rapi dan terkirim ke WhatsApp kami di <b>+62 838-5336-3510</b> — tinggal ketuk kirim di WhatsApp.</p>

    <form id="orderForm" novalidate>
      <div>
        <label for="nama">Nama</label>
        <input type="text" id="nama" placeholder="Nama lengkap kamu" autocomplete="name">
      </div>

      <div>
        <label for="pesanan">Pesanan Barang</label>
        <textarea id="pesanan" placeholder="Contoh: Photocard Jisoo BLACKPINK Born Pink ver."></textarea>
      </div>

      <div class="field-row">
        <div>
          <label for="jumlah">Jumlah</label>
          <input type="text" id="jumlah" placeholder="Contoh: 2 pcs">
        </div>
        <div>
          <label for="wa">No. WA Aktif</label>
          <input type="tel" id="wa" placeholder="08xxxxxxxxxx" autocomplete="tel">
        </div>
      </div>

      <div>
        <label for="alamat">Alamat Lengkap</label>
        <textarea id="alamat" placeholder="Jalan, No. rumah, Kelurahan, Kecamatan, Kota, Kode Pos"></textarea>
      </div>

      <div>
        <label for="ig">Nama IG/X</label>
        <input type="text" id="ig" placeholder="@username">
      </div>

      <div>
        <label>DP / Full Payment</label>
        <div class="choice-group" role="radiogroup" aria-label="Metode pembayaran">
          <label class="choice">
            <input type="radio" name="payment" value="DP" checked>
            <span>DP</span>
          </label>
          <label class="choice">
            <input type="radio" name="payment" value="Full Payment">
            <span>Full Payment</span>
          </label>
        </div>
      </div>

      <p class="err" id="errMsg">Mohon lengkapi semua kolom dulu, ya.</p>

      <button type="submit" class="submit">Kirim Pesanan ke WhatsApp</button>
    </form>

    <p class="foot">Pesanan dikirim ke <b>+6283853363510</b> via WhatsApp</p>
  </div>
</div>

<script>
  const form = document.getElementById('orderForm');
  const errMsg = document.getElementById('errMsg');
  const waNumber = "6283853363510";

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const nama = document.getElementById('nama').value.trim();
    const pesanan = document.getElementById('pesanan').value.trim();
    const jumlah = document.getElementById('jumlah').value.trim();
    const alamat = document.getElementById('alamat').value.trim();
    const wa = document.getElementById('wa').value.trim();
    const ig = document.getElementById('ig').value.trim();
    const payment = form.querySelector('input[name="payment"]:checked').value;

    if(!nama || !pesanan || !jumlah || !alamat || !wa || !ig){
      errMsg.classList.add('show');
      return;
    }
    errMsg.classList.remove('show');

    const text =
      "Halo POPKIOSK, saya ingin memesan:\n\n" +
      "Nama: " + nama + "\n" +
      "Pesanan Barang: " + pesanan + "\n" +
      "Jumlah: " + jumlah + "\n" +
      "Alamat Lengkap: " + alamat + "\n" +
      "No. WA Aktif: " + wa + "\n" +
      "Nama IG/X: " + ig + "\n" +
      "DP/Full Payment: " + payment;

    const url = "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(text);
    window.open(url, "_blank");
  });
</script>
</body>
</html>
